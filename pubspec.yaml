name: student_registration
description: A new Flutter project.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Минимально необходимые пакеты
  url_launcher: ^6.1.0
  http: ^1.1.0
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0
  provider: ^6.0.5
  web_socket_channel: ^2.4.0
  
  # Фоновый сервис (без уведомлений)
  flutter_background_service: ^5.0.0
  flutter_background_service_android: ^6.0.0
  permission_handler: ^11.0.0 
  android_intent_plus: ^5.1.0
  file_selector: ^1.0.0 
  path_provider: ^2.1.0 

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/.env
    - assets/icons/